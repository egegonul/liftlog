name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # v3 still installs the removed "tools" SDK package and fails the build.
      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # The same key must sign every build, or Android refuses the update
      # (and you'd have to uninstall = lose data). So the build fails without it.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. See README."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease -PversionCode=${{ github.run_number }}

      - run: cp app/build/outputs/apk/release/app-release.apk liftlog.apk

      - uses: actions/upload-artifact@v4
        with:
          name: liftlog-${{ github.run_number }}
          path: liftlog.apk

      # Rolling "latest" release: the download link on your phone never changes.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Lift Log (build ${{ github.run_number }})
          files: liftlog.apk
          make_latest: true
